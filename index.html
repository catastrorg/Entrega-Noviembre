<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Terrenos Bicentenario | Catastro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{margin:0;width:100%;height:100%;font-family:Arial,sans-serif} .osm-multiply{mix-blend-mode:multiply}
.leaflet-top.leaflet-left .leaflet-control-zoom{margin-left:52px} .search-control{position:relative;width:235px;box-sizing:border-box;padding:13px;background:rgba(255,255,255,.97);box-shadow:0 2px 10px #0005;border-radius:0 8px 8px 0;transition:transform .3s ease;margin-left:0!important;margin-top:75px!important}
.search-control.closed{transform:translateX(-100%)} .search-tab{position:absolute;top:0;left:100%;height:48px;width:42px;border:0;border-radius:0 8px 8px 0;background:rgba(255,255,255,.97);box-shadow:2px 2px 6px #0003;cursor:pointer;font-size:19px} .search-control label{display:block;font-size:12px;font-weight:bold;margin:10px 0 4px} .search-control select,.search-control .go{width:100%;box-sizing:border-box;padding:9px;border-radius:5px;font-size:14px}.search-control select{border:1px solid #aaa;background:#fff}.search-control .go{margin-top:12px;border:0;background:#303030;color:white;cursor:pointer;font-weight:bold}.search-control .go:disabled{opacity:.45;cursor:default}.status{font-size:12px;margin-top:9px;min-height:14px;color:#555}.block-label{color:white;font:bold 12px Arial,sans-serif;white-space:nowrap;text-align:center;text-shadow:-1px -1px #000,1px -1px #000,-1px 1px #000,1px 1px #000,0 0 3px #000;pointer-events:none}.selected-label{background:transparent;border:0;box-shadow:none;color:#ffeb00;font:bold 14px Arial,sans-serif;white-space:nowrap;text-shadow:-1px -1px #000,1px -1px #000,-1px 1px #000,1px 1px #000}.selected-label:before{display:none}.street-name{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;color:#111;font:600 13px Arial,sans-serif;white-space:nowrap;text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,0 -2px 0 #fff,0 2px 0 #fff,-2px 0 0 #fff,2px 0 0 #fff,0 0 4px #fff;pointer-events:none}.street-name:before{display:none!important}.street-name .street-rotated{display:block;width:100%;height:20px;line-height:20px;text-align:center;transform:rotate(var(--street-angle));transform-origin:center center;white-space:nowrap}.directions-control{display:none;background:#fff;border:2px solid #1b6e46;border-radius:7px;padding:11px 14px;font:bold 14px Arial,sans-serif;color:#145c3c;cursor:pointer;box-shadow:0 2px 8px #0004}.directions-control.visible{display:block}.locate{background:#fff;border:2px solid #0003;border-radius:5px;padding:6px 8px;font-size:19px;cursor:pointer;box-shadow:0 1px 5px #0005}@media(max-width:600px){.search-control{width:205px}.block-label{font-size:11px}}
</style></head><body><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';
const FILES={manzanas:'mz_nov.geojson',terrenos:'terrenos_nov.geojson',calles:'calles_wgs84.geojson'};
const map=L.map('map',{maxZoom:22,zoomControl:true}).setView([-51.62,-69.19],13);
for(const [name,z] of [['sat',200],['osm',250],['blocks',350],['plots',400],['labels',500]]){map.createPane(name);map.getPane(name).style.zIndex=z}
map.getPane('labels').style.pointerEvents='none';
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{pane:'sat',maxNativeZoom:17,maxZoom:22,attribution:'&copy; Esri'}).addTo(map);
const capaOSM=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{pane:'osm',maxNativeZoom:19,maxZoom:22,opacity:.55,className:'osm-multiply',attribution:'&copy; OpenStreetMap'}).addTo(map);
function controlarOSM(){capaOSM.setOpacity(map.getZoom()>17?0:.55)}
map.on('zoomend',controlarOSM);controlarOSM();
const clean=v=>v==null?'':String(v).replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/\s+/g,' ').trim();
const norm=v=>clean(v).toLocaleLowerCase('es');
const cmp=(a,b)=>String(a).localeCompare(String(b),'es',{numeric:true,sensitivity:'base'});
const designation=f=>clean(f.properties?.['catastro_15-7_DESIG_OFICIAL']);
const mz=f=>{const m=designation(f).match(/(?:^|\s)M\s*:\s*([^\s]+)/i);return m?clean(m[1]):clean(f.properties?.manzana)};
const pc=f=>clean(f.properties?.parcela);
const features=[];const byMz=new Map();let selected=null;let blocksLayer=null;let plotsLayer=null;const blockLabels=[];
// Acceso a Google Maps para la parcela actualmente seleccionada.
const directions=L.control({position:'bottomright'});
directions.onAdd=function(){
 const b=L.DomUtil.create('button','directions-control');
 b.type='button';b.textContent='📍 Cómo llegar con Google Maps';
 b.title='Abrir indicaciones hasta la parcela seleccionada';
 L.DomEvent.disableClickPropagation(b);L.DomEvent.disableScrollPropagation(b);
 b.addEventListener('click',()=>{
  if(!selected)return;
  // El centroide interno de Leaflet evita usar coordenadas inventadas.
  const target=typeof selected.getCenter==='function'?selected.getCenter():selected.getBounds().getCenter();
  const destination=target.lat.toFixed(7)+','+target.lng.toFixed(7);
  window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(destination)+'&travelmode=driving','_blank','noopener,noreferrer');
 });
 return b;
};
directions.addTo(map);
const control=L.control({position:'topleft'});
control.onAdd=function(){const root=L.DomUtil.create('div','search-control');root.innerHTML='<strong>🔍 Buscar parcela</strong><label for="manzana">Manzana</label><select id="manzana"><option value="">Seleccionar manzana</option></select><label for="parcela">Parcela</label><select id="parcela" disabled><option value="">Seleccionar parcela</option></select><button class="go" id="buscar" disabled>VER PARCELA</button><div class="status" id="estado" role="status"></div><button class="search-tab" type="button" id="solapa" title="Abrir o cerrar buscador" aria-label="Abrir o cerrar buscador">🔍</button>';L.DomEvent.disableClickPropagation(root);L.DomEvent.disableScrollPropagation(root);return root};control.addTo(map);
const $=id=>document.getElementById(id);const setStatus=s=>$('estado').textContent=s;
$('solapa').addEventListener('click',()=>$('solapa').parentElement.classList.toggle('closed'));
$('manzana').addEventListener('change',()=>{const group=byMz.get($('manzana').value);$('parcela').replaceChildren(new Option('Seleccionar parcela',''));$('parcela').disabled=!group;$('buscar').disabled=true;if(group){for(const p of [...group.keys()].sort(cmp))$('parcela').add(new Option(p,p))}setStatus('')});
$('parcela').addEventListener('change',()=>$('buscar').disabled=!$('parcela').value);
$('buscar').addEventListener('click',()=>{const items=byMz.get($('manzana').value)?.get($('parcela').value);if(!items?.length){setStatus('Parcela no encontrada');return}selectPlot(items[0],true);setStatus('✓ Parcela encontrada');$('solapa').parentElement.classList.add('closed')});
function selectPlot(layer,zoom){if(selected){selected.setStyle({color:'#ff7a00',weight:2,fillColor:'#ff9800',fillOpacity:.18});selected.unbindTooltip()}selected=layer;document.querySelector('.directions-control').classList.add('visible');layer.setStyle({color:'#ffe000',weight:5,fillColor:'#ffe000',fillOpacity:.42});layer.bringToFront();const f=layer.feature;layer.bindTooltip('Mz. '+mz(f)+' - Pc. '+pc(f),{permanent:true,direction:'center',className:'selected-label',opacity:1}).openTooltip();if(zoom)map.fitBounds(layer.getBounds(),{padding:[80,80],maxZoom:21})}
function indexPlots(){byMz.clear();plotsLayer.eachLayer(layer=>{const m=mz(layer.feature),p=pc(layer.feature);if(!m||!p)return;const mk=norm(m),pk=norm(p);if(!byMz.has(mk))byMz.set(mk,new Map());const group=byMz.get(mk);if(!group.has(pk))group.set(pk,[]);group.get(pk).push(layer)});$('manzana').replaceChildren(new Option('Seleccionar manzana',''));for(const m of [...byMz.keys()].sort(cmp))$('manzana').add(new Option(m,m));setStatus(byMz.size+' manzanas disponibles')}
// Measure real text width and require the full text rectangle to lie inside the polygon.
const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');
function ringContains(pt,ring){let inside=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if((a.y>pt.y)!=(b.y>pt.y)&&pt.x<(b.x-a.x)*(pt.y-a.y)/(b.y-a.y)+a.x)inside=!inside}return inside}
function geometryContainsRectangle(feature,latlng,width,height){const g=feature.geometry;if(!g||!['Polygon','MultiPolygon'].includes(g.type))return false;const polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;const center=map.latLngToLayerPoint(latlng);const points=[[-width/2,-height/2],[width/2,-height/2],[-width/2,height/2],[width/2,height/2],[0,0],[0,-height/2],[0,height/2]].map(([dx,dy])=>L.point(center.x+dx,center.y+dy));return polys.some(poly=>{const rings=poly.map(r=>r.map(([lng,lat])=>map.latLngToLayerPoint([lat,lng])));return points.every(p=>ringContains(p,rings[0])&&!rings.slice(1).some(hole=>ringContains(p,hole)))})}
function refreshLabels(){const zoom=map.getZoom();ctx.font=(innerWidth<=600?'bold 11px Arial':'bold 12px Arial');for(const item of blockLabels){const w=ctx.measureText(item.text).width+12,h=22;const visible=zoom<=18&&geometryContainsRectangle(item.feature,item.center,w,h);if(visible&&!map.hasLayer(item.marker))item.marker.addTo(map);else if(!visible&&map.hasLayer(item.marker))map.removeLayer(item.marker)}}
map.on('zoomend',refreshLabels);
// Nombres de calles independientes de OSM: negro con halo blanco, desde zoom 18.
let streetFeatures=[];
const streetLabels=L.layerGroup().addTo(map);
function streetSegments(f){const g=f.geometry;if(!g)return [];if(g.type==='LineString')return [g.coordinates];if(g.type==='MultiLineString')return g.coordinates;return []}
function refreshStreetLabels(){
 streetLabels.clearLayers();
 if(map.getZoom()<=17||!streetFeatures.length)return;
 const bounds=map.getBounds().pad(.12), candidates=[];
 for(const f of streetFeatures){
  const name=clean(f.properties?.name);if(!name)continue;
  for(const segment of streetSegments(f)){
   if(segment.length<2)continue;
   let longest=0,best=null;
   for(let i=1;i<segment.length;i++){
    const a=L.latLng(segment[i-1][1],segment[i-1][0]),b=L.latLng(segment[i][1],segment[i][0]);
    if(!bounds.contains(a)&&!bounds.contains(b))continue;
    const pa=map.latLngToLayerPoint(a),pb=map.latLngToLayerPoint(b);
    const length=pa.distanceTo(pb);
    if(length>longest){longest=length;let angle=Math.atan2(pb.y-pa.y,pb.x-pa.x)*180/Math.PI;if(angle>90)angle-=180;if(angle< -90)angle+=180;best={point:L.latLng((a.lat+b.lat)/2,(a.lng+b.lng)/2),angle}}
   }
   if(best&&longest>Math.max(48,name.length*5.5))candidates.push({name,point:best.point,angle:best.angle,length:longest});
  }
 }
 candidates.sort((a,b)=>b.length-a.length);
 const placed=[];
 for(const c of candidates){
  const pos=map.latLngToContainerPoint(c.point);
  const width=c.name.length*7.5+14;
  const rad=c.angle*Math.PI/180, halfW=(Math.abs(Math.cos(rad))*width+Math.abs(Math.sin(rad))*20)/2,halfH=(Math.abs(Math.sin(rad))*width+Math.abs(Math.cos(rad))*20)/2;
  if(placed.some(p=>Math.abs(p.x-pos.x)<p.halfW+halfW+14&&Math.abs(p.y-pos.y)<p.halfH+halfH+10))continue;
  placed.push({x:pos.x,y:pos.y,halfW,halfH});
  L.marker(c.point,{interactive:false,keyboard:false,icon:L.divIcon({className:'street-name',html:'<span class="street-rotated" style="--street-angle:'+c.angle.toFixed(2)+'deg">'+escapeHTML(c.name)+'</span>',iconSize:[width,20],iconAnchor:[width/2,10]})}).addTo(streetLabels);
  if(placed.length>=160)break;
 }
}
map.on('zoomend moveend',refreshStreetLabels);

async function loadGeoJSON(filename){const res=await fetch('./'+filename,{cache:'no-cache'});if(!res.ok)throw new Error(filename+': HTTP '+res.status);const data=await res.json();if(data.type!=='FeatureCollection'||!Array.isArray(data.features))throw new Error(filename+': no es un FeatureCollection');return data}
async function start(){const results=await Promise.allSettled([loadGeoJSON(FILES.manzanas),loadGeoJSON(FILES.terrenos),loadGeoJSON(FILES.calles)]);const [blocks,plots,streets]=results;const errors=[];
if(blocks.status==='fulfilled'){blocksLayer=L.geoJSON(blocks.value,{pane:'blocks',style:f=>{const type=norm(f.properties?.evev);return {color:['espacio verde','reserva'].includes(type)?'#00a83a':type==='espacio comunitario'?'#00d8e8':'#000',weight:2,opacity:.95,fillOpacity:0}},onEachFeature:(f,layer)=>{const text=clean(f.properties?.manzana);if(!text)return;const center=layer.getBounds().getCenter();const marker=L.marker(center,{pane:'labels',interactive:false,icon:L.divIcon({className:'block-label',html:'',iconSize:[0,0]})});marker.setIcon(L.divIcon({className:'block-label',html:escapeHTML(text),iconSize:[0,0]}));blockLabels.push({feature:f,center,marker,text})}}).addTo(map);refreshLabels()}else errors.push(blocks.reason.message);
if(plots.status==='fulfilled'){plotsLayer=L.geoJSON(plots.value,{pane:'plots',style:{color:'#ff7a00',weight:2,fillColor:'#ff9800',fillOpacity:.18},onEachFeature:(f,layer)=>{layer.on('mouseover',()=>{if(layer!==selected)layer.setStyle({weight:3,fillOpacity:.32})});layer.on('mouseout',()=>{if(layer!==selected)layer.setStyle({weight:2,fillOpacity:.18})});layer.on('click',()=>selectPlot(layer,true))}}).addTo(map);indexPlots();if(plotsLayer.getBounds().isValid())map.fitBounds(plotsLayer.getBounds(),{padding:[35,35]})}else errors.push(plots.reason.message);
if(streets.status==='fulfilled'){streetFeatures=streets.value.features.filter(f=>clean(f.properties?.name));refreshStreetLabels()}else errors.push(streets.reason.message);
if(errors.length){setStatus('Error: '+errors.join(' | '));console.error('Errores de carga:',errors)} }
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const locate=L.control({position:'topright'});locate.onAdd=()=>{const b=L.DomUtil.create('button','locate');b.type='button';b.textContent='📍';b.title='Mi ubicación';L.DomEvent.disableClickPropagation(b);b.addEventListener('click',()=>map.locate({setView:true,maxZoom:19,enableHighAccuracy:true}));return b};locate.addTo(map);
let me=null,accuracy=null;map.on('locationfound',e=>{if(me)map.removeLayer(me);if(accuracy)map.removeLayer(accuracy);me=L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:3,fillColor:'#3388ff',fillOpacity:1}).addTo(map).bindPopup('Mi ubicación');accuracy=L.circle(e.latlng,{radius:e.accuracy,weight:1,fillOpacity:.1}).addTo(map)});map.on('locationerror',e=>setStatus('Ubicación: '+e.message));
start();
</script></body></html>
